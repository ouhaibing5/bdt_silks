[project]
name = "bdt-customer-mcp"
version = "0.2.1"
description = "MCP server for Yonglitong Badatong (八达通) customer and settlement account queries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "mcp>=1.2.0,<2",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bdt-customer-mcp = "bdt_customer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout：把 src/bdt_customer_mcp 打成顶层包 bdt_customer_mcp
[tool.hatch.build.targets.wheel]
packages = ["src/bdt_customer_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/bdt_customer_mcp" = "bdt_customer_mcp"

[tool.hatch.build.targets.sdist]
exclude = [
  ".venv",
  ".npx-venv",
  ".pytest_cache",
  "__pycache__",
  "*.egg-info",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
